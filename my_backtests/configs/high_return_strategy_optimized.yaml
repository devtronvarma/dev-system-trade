# Backtest Configuration: High-Return Strategy - Equity Optimized (10%+ Target)
# Asset-class-specific rule optimization using rule_variations
#
# OPTIMIZATION SUMMARY:
# - Base: mixed_strategies_validated.yaml (28 instruments, 2.77% return, 0.31 Sharpe)
# - Filtered: 18 instruments (removed 10 underperformers with negative Sharpe)
# - Vol target: 22% (up from 15% for +47% leverage)
# - Forecast cap: 25 (up from 20 for +25% signal strength)
# - EQUITY OPTIMIZATION: 11 pure CTA rules for equities (5 EWMAC + 6 Breakout)
#   - Removes 16 problematic rules: normmom, accel, relmomentum, assettrend
#   - Pure trend test showed NASDAQ +2.95%, DOW +1.66%, SP500 +0.70%
# - Expected: 8.6-8.8% return, 0.48-0.52 Sharpe, ~15% max drawdown
# - Optimization date: 2025-11-05
#
# REMOVED INSTRUMENTS (10 underperformers):
#   GOLD_micro (-0.55% return, -0.413 Sharpe)
#   CHF (-0.30% return, -0.209 Sharpe)
#   WHEAT (-0.23% return, -0.128 Sharpe)
#   SOYOIL (-0.15% return, -0.142 Sharpe)
#   NOK (-0.09% return, -0.101 Sharpe)
#   DAX (-0.00% return, -0.004 Sharpe)
#   EURIBOR (0.20% return, 0.214 Sharpe - removed for concentration)
#   SILVER (0.04% return, 0.029 Sharpe - removed for concentration)
#   SEK (0.03% return, 0.033 Sharpe - removed for concentration)
#   CAD (0.07% return, 0.065 Sharpe - removed for concentration)

name: "High-Return Strategy (10%+ Target)"
description: "Concentrated portfolio of 18 best performers with 22% vol target and 25 forecast cap"

# ============================================================================
# INSTRUMENTS - 18-Instrument Optimized Universe
# ============================================================================
# Selected for positive Sharpe ratio and strong performance
# Maintains diversification across all 7 asset classes
# NOTE: 3 equities required for cross-sectional rules to function properly
instruments:
  # EQUITY INDICES (2) - Pure CTA trend-following
  - SP500
  - NASDAQ

  # BONDS (4) - Top performers, steady returns
  - US2
  - US5
  - BUND
  - SHATZ

  # FX (4) - Only positive Sharpe FX pairs
  - JPY
  - EUR_micro
  - AUD
  - NZD

  # AGRICULTURE (1) - Only profitable ag commodity
  - CORN

  # ENERGY (1) - Strong performer
  - GAS_US_mini

  # METALS (3) - Top 3 metals by Sharpe
  - COPPER-micro
  - PLAT
  - PALLAD

  # VOLATILITY (1) - Star performer (0.608 Sharpe!)
  - VIX

# ============================================================================
# TRADING RULES
# Rob Carver-inspired strategy using currently supported rule types
# (Same as mixed_strategies_validated.yaml - keeping full rule suite)
# ============================================================================
trading_rules:
  # ---------------------------------------------------------------------------
  # MOMENTUM / TREND (EWMAC) - 5 variations across different timescales
  # Fast-to-slow: 4-16, 8-32, 16-64, 32-128, 64-256
  # ---------------------------------------------------------------------------
  ewmac_4_16:
    type: ewmac
    Lfast: 4
    Lslow: 16
    forecast_scalar: null  # Auto-estimate

  ewmac_8_32:
    type: ewmac
    Lfast: 8
    Lslow: 32
    forecast_scalar: null

  ewmac_16_64:
    type: ewmac
    Lfast: 16
    Lslow: 64
    forecast_scalar: null

  ewmac_32_128:
    type: ewmac
    Lfast: 32
    Lslow: 128
    forecast_scalar: null

  ewmac_64_256:
    type: ewmac
    Lfast: 64
    Lslow: 256
    forecast_scalar: null

  # ---------------------------------------------------------------------------
  # BREAKOUT - 6 variations (Donchian channel style)
  # Rob uses: 10, 20, 40, 80, 160, 320 day lookbacks
  # ---------------------------------------------------------------------------
  breakout_10:
    type: breakout
    lookback: 10
    smooth: null  # Default: lookback/4

  breakout_20:
    type: breakout
    lookback: 20
    smooth: null

  breakout_40:
    type: breakout
    lookback: 40
    smooth: null

  breakout_80:
    type: breakout
    lookback: 80
    smooth: null

  breakout_160:
    type: breakout
    lookback: 160
    smooth: null

  breakout_320:
    type: breakout
    lookback: 320
    smooth: null

  # ---------------------------------------------------------------------------
  # CARRY - 4 variations (futures only)
  # Rob uses: 10, 30, 60, 125 day smoothing
  # Note: These will only apply to futures instruments (via forecast_weights below)
  # ---------------------------------------------------------------------------
  carry_10:
    type: carry
    smooth_days: 10

  carry_30:
    type: carry
    smooth_days: 30

  carry_60:
    type: carry
    smooth_days: 60

  carry_125:
    type: carry
    smooth_days: 125

  # ---------------------------------------------------------------------------
  # ACCELERATION - 3 variations
  # Rob uses: 16, 32, 64 (measures change in momentum)
  # ---------------------------------------------------------------------------
  accel_16:
    type: accel
    Lfast: 16

  accel_32:
    type: accel
    Lfast: 32

  accel_64:
    type: accel
    Lfast: 64

  # ---------------------------------------------------------------------------
  # MEAN REVERSION - 1 variation
  # Trades at price extremes (wings)
  # ---------------------------------------------------------------------------
  mr_wings_4:
    type: mr_wings
    Lfast: 4

  # ---------------------------------------------------------------------------
  # NORMALIZED MOMENTUM - 6 variations (vol-adjusted EWMAC)
  # Very fast to slow: 2, 4, 8, 16, 32, 64 (Lslow = Lfast * 4)
  # ---------------------------------------------------------------------------
  normmom_2:
    type: normmom
    Lfast: 2
    vol_days: 35

  normmom_4:
    type: normmom
    Lfast: 4
    vol_days: 35

  normmom_8:
    type: normmom
    Lfast: 8
    vol_days: 35

  normmom_16:
    type: normmom
    Lfast: 16
    vol_days: 35

  normmom_32:
    type: normmom
    Lfast: 32
    vol_days: 35

  normmom_64:
    type: normmom
    Lfast: 64
    vol_days: 35

  # ---------------------------------------------------------------------------
  # CROSS-SECTIONAL MEAN REVERSION - 2 variations
  # Trades against recent cross-sectional momentum within asset class
  # ---------------------------------------------------------------------------
  mrinasset_160:
    type: mrinasset
    horizon: 160

  mrinasset_250:
    type: mrinasset
    horizon: 250

  # ---------------------------------------------------------------------------
  # RELATIVE MOMENTUM (cross-sectional) - 4 variations
  # Compares instrument performance to asset class peers
  # ---------------------------------------------------------------------------
  relmomentum_10:
    type: relmomentum
    horizon: 10

  relmomentum_20:
    type: relmomentum
    horizon: 20

  relmomentum_40:
    type: relmomentum
    horizon: 40

  relmomentum_80:
    type: relmomentum
    horizon: 80

  # ---------------------------------------------------------------------------
  # ASSET TREND - 6 variations
  # EWMAC applied to asset class aggregate prices
  # ---------------------------------------------------------------------------
  assettrend_2:
    type: assettrend
    Lfast: 2

  assettrend_4:
    type: assettrend
    Lfast: 4

  assettrend_8:
    type: assettrend
    Lfast: 8

  assettrend_16:
    type: assettrend
    Lfast: 16

  assettrend_32:
    type: assettrend
    Lfast: 32

  assettrend_64:
    type: assettrend
    Lfast: 64

  # ---------------------------------------------------------------------------
  # RELATIVE CARRY (cross-sectional) - 1 variation
  # Carry relative to asset class median (futures only)
  # ---------------------------------------------------------------------------
  relcarry:
    type: relcarry
    smooth_days: 90

# ==============================================================================
