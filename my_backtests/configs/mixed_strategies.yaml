# Backtest Configuration: Mixed Strategy Types
# Combines different rule types: trend, breakout, mean reversion, and acceleration

name: "Mixed Strategy Types"
description: "Diversified approach using trend following, breakout, mean reversion, and acceleration"

# ============================================================================
# INSTRUMENTS
# ============================================================================
instruments:
  - SP500
  - NASDAQ
  - US10
  - CORN 
  - BUND
  - BRENT-LAST
  - EUROSTX
  - GBP
  - GOLD_micro
  - SILVER
  - NIKKEI
  - JPY
  - EUR_micro

# ============================================================================
# TRADING RULES
# Rob Carver-inspired strategy using currently supported rule types
# ============================================================================
trading_rules:
  # ---------------------------------------------------------------------------
  # MOMENTUM / TREND (EWMAC) - 5 variations across different timescales
  # Fast-to-slow: 4-16, 8-32, 16-64, 32-128, 64-256
  # ---------------------------------------------------------------------------
  ewmac_4_16:
    type: ewmac
    Lfast: 4
    Lslow: 16
    forecast_scalar: null  # Auto-estimate

  ewmac_8_32:
    type: ewmac
    Lfast: 8
    Lslow: 32
    forecast_scalar: null

  ewmac_16_64:
    type: ewmac
    Lfast: 16
    Lslow: 64
    forecast_scalar: null

  ewmac_32_128:
    type: ewmac
    Lfast: 32
    Lslow: 128
    forecast_scalar: null

  ewmac_64_256:
    type: ewmac
    Lfast: 64
    Lslow: 256
    forecast_scalar: null

  # ---------------------------------------------------------------------------
  # BREAKOUT - 6 variations (Donchian channel style)
  # Rob uses: 10, 20, 40, 80, 160, 320 day lookbacks
  # ---------------------------------------------------------------------------
  breakout_10:
    type: breakout
    lookback: 10
    smooth: null  # Default: lookback/4

  breakout_20:
    type: breakout
    lookback: 20
    smooth: null

  breakout_40:
    type: breakout
    lookback: 40
    smooth: null

  breakout_80:
    type: breakout
    lookback: 80
    smooth: null

  breakout_160:
    type: breakout
    lookback: 160
    smooth: null

  breakout_320:
    type: breakout
    lookback: 320
    smooth: null

  # ---------------------------------------------------------------------------
  # CARRY - 4 variations (futures only)
  # Rob uses: 10, 30, 60, 125 day smoothing
  # Note: These will only apply to futures instruments (via forecast_weights below)
  # ---------------------------------------------------------------------------
  carry_10:
    type: carry
    smooth_days: 10

  carry_30:
    type: carry
    smooth_days: 30

  carry_60:
    type: carry
    smooth_days: 60

  carry_125:
    type: carry
    smooth_days: 125

  # ---------------------------------------------------------------------------
  # ACCELERATION - 3 variations
  # Rob uses: 16, 32, 64 (measures change in momentum)
  # ---------------------------------------------------------------------------
  accel_16:
    type: accel
    Lfast: 16

  accel_32:
    type: accel
    Lfast: 32

  accel_64:
    type: accel
    Lfast: 64

  # ---------------------------------------------------------------------------
  # MEAN REVERSION - 1 variation
  # Trades at price extremes (wings)
  # ---------------------------------------------------------------------------
  mr_wings_4:
    type: mr_wings
    Lfast: 4

  # ---------------------------------------------------------------------------
  # NORMALIZED MOMENTUM - 6 variations (vol-adjusted EWMAC)
  # Very fast to slow: 2, 4, 8, 16, 32, 64 (Lslow = Lfast * 4)
  # ---------------------------------------------------------------------------
  normmom_2:
    type: normmom
    Lfast: 2
    vol_days: 35

  normmom_4:
    type: normmom
    Lfast: 4
    vol_days: 35

  normmom_8:
    type: normmom
    Lfast: 8
    vol_days: 35

  normmom_16:
    type: normmom
    Lfast: 16
    vol_days: 35

  normmom_32:
    type: normmom
    Lfast: 32
    vol_days: 35

  normmom_64:
    type: normmom
    Lfast: 64
    vol_days: 35

  # ---------------------------------------------------------------------------
  # CROSS-SECTIONAL MEAN REVERSION - 2 variations
  # Trades against recent cross-sectional momentum within asset class
  # ---------------------------------------------------------------------------
  mrinasset_160:
    type: mrinasset
    horizon: 160

  mrinasset_250:
    type: mrinasset
    horizon: 250

# ==============================================================================
# FORECAST WEIGHTS (Instrument-Specific Rule Application)
# ==============================================================================
# This nested structure allows different rules to apply to different instruments.
# Carry rules only work with futures that have roll data, so we exclude FX and metals.
