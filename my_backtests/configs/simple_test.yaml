# Simple Test Configuration
# A minimal backtest to verify the YAML system works

name: "Simple EWMAC Test"
description: "Single EWMAC rule on SP500 - quick test of YAML backtesting system"

instruments:
  - SP500

trading_rules:
  ewmac_64_256:
    type: ewmac
    Lfast: 64
    Lslow: 256
    forecast_scalar: null

backtest:
  start_date: "2010-01-01"
  end_date: null
  notional_trading_capital: 100000
  base_currency: "USD"
  percentage_vol_target: 20
  forecast_weight_method: "equal_weights"
  forecast_scalar_pooling: true
  instrument_weight_method: "equal_weights"
  use_estimations: false  # Faster for testing

output:
  save_results: true
  output_dir: "outputs"
  plot_filename: "simple_test.png"
  export_stats: false
