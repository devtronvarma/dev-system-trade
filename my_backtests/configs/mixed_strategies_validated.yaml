# Backtest Configuration: Mixed Strategy Types (VALIDATED)
# Combines different rule types: trend, breakout, mean reversion, and acceleration
#
# VALIDATION SUMMARY:
# - Original: 57 instruments
# - Validated: 28 instruments
# - Removed: 29 instruments (negative prices, insufficient history, or missing data)
# - Validation date: 2025-11-05
#
# REMOVED INSTRUMENTS (with reasons):
#   OMX, MXP, ZAR, US10, US20, SOYBEAN_mini, SOYMEAL, COTTON, LEANHOG,
#   CRUDE_W, GASOILINE, HEATOIL - NEGATIVE PRICES (data corruption)
#
#   R1000, EUROSTX, CAC, AEX, NIKKEI, NIKKEI400, TOPIX, MSCIWORLD, BOVESPA,
#   US30, BOBL, BUXL, BTP, BTP3, OAT, BRENT-LAST, ALUMINIUM - INSUFFICIENT HISTORY

name: "Mixed Strategy Types (Validated)"
description: "Diversified approach using 28 validated instruments with trend following, breakout, mean reversion, and acceleration"

# ============================================================================
# INSTRUMENTS - 28-Instrument Validated Universe
# ============================================================================
# Only instruments with:
#   ✓ No negative prices
#   ✓ Data available from ~2003 or earlier
#   ✓ Sufficient data density
instruments:
  # EQUITY INDICES (3)
  - SP500
  - NASDAQ
  - DOW
  - DAX

  # BONDS (4)
  - US2
  - US5
  - BUND
  - SHATZ
  - EURIBOR

  # FX (8)
  - GBP
  - JPY
  - EUR_micro
  - AUD
  - CAD
  - CHF
  - NZD
  - SEK
  - NOK

  # AGRICULTURE (3)
  - CORN
  - WHEAT
  - SOYOIL

  # ENERGY (1)
  - GAS_US_mini

  # METALS (6)
  - GOLD_micro
  - SILVER
  - COPPER-micro
  - PLAT
  - PALLAD

  # VOLATILITY (1)
  - VIX

# ============================================================================
# TRADING RULES
# Rob Carver-inspired strategy using currently supported rule types
# ============================================================================
trading_rules:
  # ---------------------------------------------------------------------------
  # MOMENTUM / TREND (EWMAC) - 5 variations across different timescales
  # Fast-to-slow: 4-16, 8-32, 16-64, 32-128, 64-256
  # ---------------------------------------------------------------------------
  ewmac_4_16:
    type: ewmac
    Lfast: 4
    Lslow: 16
    forecast_scalar: null  # Auto-estimate

  ewmac_8_32:
    type: ewmac
    Lfast: 8
    Lslow: 32
    forecast_scalar: null

  ewmac_16_64:
    type: ewmac
    Lfast: 16
    Lslow: 64
    forecast_scalar: null

  ewmac_32_128:
    type: ewmac
    Lfast: 32
    Lslow: 128
    forecast_scalar: null

  ewmac_64_256:
    type: ewmac
    Lfast: 64
    Lslow: 256
    forecast_scalar: null

  # ---------------------------------------------------------------------------
  # BREAKOUT - 6 variations (Donchian channel style)
  # Rob uses: 10, 20, 40, 80, 160, 320 day lookbacks
  # ---------------------------------------------------------------------------
  breakout_10:
    type: breakout
    lookback: 10
    smooth: null  # Default: lookback/4

  breakout_20:
    type: breakout
    lookback: 20
    smooth: null

  breakout_40:
    type: breakout
    lookback: 40
    smooth: null

  breakout_80:
    type: breakout
    lookback: 80
    smooth: null

  breakout_160:
    type: breakout
    lookback: 160
    smooth: null

  breakout_320:
    type: breakout
    lookback: 320
    smooth: null

  # ---------------------------------------------------------------------------
  # CARRY - 4 variations (futures only)
  # Rob uses: 10, 30, 60, 125 day smoothing
  # Note: These will only apply to futures instruments (via forecast_weights below)
  # ---------------------------------------------------------------------------
  carry_10:
    type: carry
    smooth_days: 10

  carry_30:
    type: carry
    smooth_days: 30

  carry_60:
    type: carry
    smooth_days: 60

  carry_125:
    type: carry
    smooth_days: 125

  # ---------------------------------------------------------------------------
  # ACCELERATION - 3 variations
  # Rob uses: 16, 32, 64 (measures change in momentum)
  # ---------------------------------------------------------------------------
  accel_16:
    type: accel
    Lfast: 16

  accel_32:
    type: accel
    Lfast: 32

  accel_64:
    type: accel
    Lfast: 64

  # ---------------------------------------------------------------------------
  # MEAN REVERSION - 1 variation
  # Trades at price extremes (wings)
  # ---------------------------------------------------------------------------
  mr_wings_4:
    type: mr_wings
    Lfast: 4

  # ---------------------------------------------------------------------------
  # NORMALIZED MOMENTUM - 6 variations (vol-adjusted EWMAC)
  # Very fast to slow: 2, 4, 8, 16, 32, 64 (Lslow = Lfast * 4)
  # ---------------------------------------------------------------------------
  normmom_2:
    type: normmom
    Lfast: 2
    vol_days: 35

  normmom_4:
    type: normmom
    Lfast: 4
    vol_days: 35

  normmom_8:
    type: normmom
    Lfast: 8
    vol_days: 35

  normmom_16:
    type: normmom
    Lfast: 16
    vol_days: 35

  normmom_32:
    type: normmom
    Lfast: 32
    vol_days: 35

  normmom_64:
    type: normmom
    Lfast: 64
    vol_days: 35

  # ---------------------------------------------------------------------------
  # CROSS-SECTIONAL MEAN REVERSION - 2 variations
  # Trades against recent cross-sectional momentum within asset class
  # ---------------------------------------------------------------------------
  mrinasset_160:
    type: mrinasset
    horizon: 160

  mrinasset_250:
    type: mrinasset
    horizon: 250

  # ---------------------------------------------------------------------------
  # RELATIVE MOMENTUM (cross-sectional) - 4 variations
  # Compares instrument performance to asset class peers
  # ---------------------------------------------------------------------------
  relmomentum_10:
    type: relmomentum
    horizon: 10

  relmomentum_20:
    type: relmomentum
    horizon: 20

  relmomentum_40:
    type: relmomentum
    horizon: 40

  relmomentum_80:
    type: relmomentum
    horizon: 80

  # ---------------------------------------------------------------------------
  # ASSET TREND - 6 variations
  # EWMAC applied to asset class aggregate prices
  # ---------------------------------------------------------------------------
  assettrend_2:
    type: assettrend
    Lfast: 2

  assettrend_4:
    type: assettrend
    Lfast: 4

  assettrend_8:
    type: assettrend
    Lfast: 8

  assettrend_16:
    type: assettrend
    Lfast: 16

  assettrend_32:
    type: assettrend
    Lfast: 32

  assettrend_64:
    type: assettrend
    Lfast: 64

  # ---------------------------------------------------------------------------
  # RELATIVE CARRY (cross-sectional) - 1 variation
  # Carry relative to asset class median (futures only)
  # ---------------------------------------------------------------------------
  relcarry:
    type: relcarry
    smooth_days: 90

# ==============================================================================
# FORECAST WEIGHTS (Instrument-Specific Rule Application)
# ==============================================================================
# Smart rule assignment by asset class:
#
# CATEGORY A - FULL RULES (38 rules): Equity indices, energy, agriculture
#   All rules including carry and relcarry (futures with clear roll schedules)
#
# CATEGORY B - NO CARRY (33 rules): Spot FX, precious metals, volatility
#   Skip carry/relcarry rules due to lack of robust roll data or spot nature
#
# CATEGORY C - BONDS (38 rules): Government bonds
#   Full rule suite (bonds have well-defined roll schedules)
#
# Weights set to null = shrinkage estimation from data
# ==============================================================================
forecast_weights:
  # =========================================================================
  # CATEGORY A: EQUITY INDICES - FULL RULES (38 rules)
  # =========================================================================
  SP500: &full_rules
    ewmac_4_16: null
    ewmac_8_32: null
    ewmac_16_64: null
    ewmac_32_128: null
    ewmac_64_256: null
    breakout_10: null
    breakout_20: null
    breakout_40: null
    breakout_80: null
    breakout_160: null
    breakout_320: null
    carry_10: null
    carry_30: null
    carry_60: null
    carry_125: null
    accel_16: null
    accel_32: null
    accel_64: null
    mr_wings_4: null
    normmom_2: null
    normmom_4: null
    normmom_8: null
    normmom_16: null
    normmom_32: null
    normmom_64: null
    mrinasset_160: null
    mrinasset_250: null
    relmomentum_10: null
    relmomentum_20: null
    relmomentum_40: null
    relmomentum_80: null
    assettrend_2: null
    assettrend_4: null
    assettrend_8: null
    assettrend_16: null
    assettrend_32: null
    assettrend_64: null
    relcarry: null

  NASDAQ: *full_rules
  DOW: *full_rules
  DAX: *full_rules

  # =========================================================================
  # CATEGORY C: BONDS - FULL RULES (38 rules)
  # =========================================================================
  US2: *full_rules
  US5: *full_rules
  BUND: *full_rules
  SHATZ: *full_rules
  EURIBOR: *full_rules

  # =========================================================================
  # CATEGORY A: AGRICULTURE - FULL RULES (38 rules)
  # =========================================================================
  CORN: *full_rules
  WHEAT: *full_rules
  SOYOIL: *full_rules

  # =========================================================================
  # CATEGORY A: ENERGY - FULL RULES (38 rules)
  # =========================================================================
  GAS_US_mini: *full_rules

  # =========================================================================
  # CATEGORY B: FX - NO CARRY (33 rules)
  # =========================================================================
  # Carry rules omitted for spot FX (lack futures roll data)
  GBP: &no_carry_rules
    ewmac_4_16: null
    ewmac_8_32: null
    ewmac_16_64: null
    ewmac_32_128: null
    ewmac_64_256: null
    breakout_10: null
    breakout_20: null
    breakout_40: null
    breakout_80: null
    breakout_160: null
    breakout_320: null
    # carry rules omitted
    accel_16: null
    accel_32: null
    accel_64: null
    mr_wings_4: null
    normmom_2: null
    normmom_4: null
    normmom_8: null
    normmom_16: null
    normmom_32: null
    normmom_64: null
    mrinasset_160: null
    mrinasset_250: null
    relmomentum_10: null
    relmomentum_20: null
    relmomentum_40: null
    relmomentum_80: null
    assettrend_2: null
    assettrend_4: null
    assettrend_8: null
    assettrend_16: null
    assettrend_32: null
    assettrend_64: null
    # relcarry omitted (no roll data for FX)

  JPY: *no_carry_rules
  EUR_micro: *no_carry_rules
  AUD: *no_carry_rules
  CAD: *no_carry_rules
  CHF: *no_carry_rules
  NZD: *no_carry_rules
  SEK: *no_carry_rules
  NOK: *no_carry_rules

  # =========================================================================
  # CATEGORY B: METALS - NO CARRY (33 rules)
  # =========================================================================
  # Precious metals often lack robust roll data
  GOLD_micro: *no_carry_rules
  SILVER: *no_carry_rules
  COPPER-micro: *no_carry_rules
  PLAT: *no_carry_rules
  PALLAD: *no_carry_rules

  # =========================================================================
  # CATEGORY B: VOLATILITY - NO CARRY (33 rules)
  # =========================================================================
  # Volatility indices are spot-like instruments
  VIX: *no_carry_rules

# ==============================================================================
# FUTURE ENHANCEMENTS - Rules Not Yet Supported
# ==============================================================================
# TODO: Add support for these rule types in yaml_config_loader.py
#
# SKEW RULES (absolute and relative volatility skew):
#   - skewabs_180, skewabs_365, skewrv_180, skewrv_365
#   - Requires: factor_trading_rule function, skew calculation
#
# ==============================================================================
# RECENTLY ADDED RULES (NOW SUPPORTED)
# ==============================================================================
# ✓ NORMALIZED MOMENTUM (vol-adjusted EWMAC):
#   - normmom_2, normmom_4, normmom_8, normmom_16, normmom_32, normmom_64
#   - Uses: ewmac_calc_vol function
#
# ✓ CROSS-SECTIONAL MEAN REVERSION:
#   - mrinasset_160, mrinasset_250
#   - Uses: cross_sectional_mean_reversion function
#   - Trades against recent cross-sectional momentum within asset class
#
# ✓ RELATIVE MOMENTUM (cross-sectional):
#   - relmomentum_10, relmomentum_20, relmomentum_40, relmomentum_80
#   - Uses: relative_momentum function
#   - Compares instrument performance to asset class peers
#
# ✓ ASSET TREND (EWMAC on asset class prices):
#   - assettrend_2, assettrend_4, assettrend_8, assettrend_16, assettrend_32, assettrend_64
#   - Uses: ewmac function with asset class aggregate price data
#   - Captures macro-level movements and regime shifts
#
# ✓ RELATIVE CARRY (cross-sectional):
#   - relcarry
#   - Uses: relative_carry function
#   - Carry relative to asset class median (futures only)
# ==============================================================================

# ============================================================================
# BACKTEST PARAMETERS
# ============================================================================
backtest:
  start_date: "2003-01-01"  # Adjusted to ensure all instruments have data
  end_date: null

  notional_trading_capital: 1000000
  base_currency: "USD"
  percentage_vol_target: 15  # Rob uses 20%, but we keep 15% for now (more conservative)

  # -------------------- Forecast-Level Configuration --------------------
  forecast_cap: 20.0  # Rob Carver uses 20 (default in pysystemtrade)
  forecast_weight_method: "shrinkage"  # Estimate optimal rule weights from data
  forecast_scalar_pooling: false  # Don't pool forecast scalars across instruments

  # FDM (Forecast Diversification Multiplier)
  # null = estimate from data (recommended)
  # Set to fixed value (e.g., 1.5) if you want to override estimation
  forecast_div_multiplier: null

  # -------------------- Instrument-Level Configuration --------------------
  instrument_weight_method: "shrinkage"  # Estimate optimal instrument weights from data

  # IDM (Instrument Diversification Multiplier)
  # null = estimate from data (recommended)
  # Rob uses 2.5 for his 109-instrument portfolio
  # For 28 instruments, expect ~1.8-2.0
  instrument_div_multiplier: null

  use_estimations: true  # Use shrinkage to estimate weights (vs equal weights)

# ============================================================================
# OUTPUT SETTINGS
# ============================================================================
output:
  save_results: true
  output_dir: "outputs"
  plot_filename: "mixed_strategies_validated.png"
  export_stats: true
  stats_filename: "mixed_strategies_validated_stats.csv"
